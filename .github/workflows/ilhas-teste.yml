name: Teste ilhas (temporário)
on:
  push:
    branches: [ilhas-teste]
    paths: ["explorar-ilhas.mjs", "ilhas-precos.mjs", ".github/workflows/ilhas-teste.yml"]
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node explorar-ilhas.mjs
      - name: Gravar os resultados no ramo
        run: |
          git config user.name "combustiveis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A explorar
          git diff --cached --quiet && exit 0
          git commit -m "Resultados da exploração das ilhas [skip ci]"
          git push
