name: Teste ilhas (temporário)
on:
  push:
    branches: [ilhas-teste]
    paths: ["verificar-live.mjs", ".github/workflows/ilhas-teste.yml"]
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          npm init -y >/dev/null
          npm i -s playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verificar a página publicada
        run: |
          set +e
          node verificar-live.mjs > explorar/live-log.txt 2>&1
          echo "codigo de saida $?" >> explorar/live-log.txt
          cat explorar/live-log.txt
      - name: Gravar os resultados no ramo
        run: |
          git config user.name "combustiveis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A explorar
          git diff --cached --quiet && exit 0
          git commit -m "Verificação da página publicada [skip ci]"
          git push
