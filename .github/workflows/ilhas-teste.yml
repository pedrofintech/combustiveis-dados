name: Teste da página (temporário)
on:
  push:
    branches: [ilhas-teste]
    paths: ["teste-pagina/**", "combustivel-mais-barato.js", ".github/workflows/ilhas-teste.yml"]
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright (Chromium, Firefox e WebKit)
        run: |
          set +e
          mkdir -p resultados
          npm init -y >/dev/null
          npm i -s playwright@latest > resultados/instalar.txt 2>&1
          npx playwright --version >> resultados/instalar.txt 2>&1
          npx playwright install --with-deps chromium firefox webkit >> resultados/instalar.txt 2>&1
          echo "codigo de saida $?" >> resultados/instalar.txt
          tail -15 resultados/instalar.txt
      - name: Página de teste local
        if: always()
        run: |
          mkdir -p site/esboco site/combustiveis-dados
          cp -r teste-pagina site/esboco/real
          cp combustivel-mais-barato.js site/combustiveis-dados/
          cd site && (python3 -m http.server 8792 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
      - name: Histórico do browser e concelhos vizinhos, nos três browsers
        if: always()
        run: |
          set +e
          mkdir -p resultados
          export NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          cd site/esboco/real
          for b in chromium firefox webkit; do
            BROWSER=$b timeout 600 node teste-historico.cjs > "$GITHUB_WORKSPACE/resultados/$b.txt" 2>&1
            echo "codigo de saida $?" >> "$GITHUB_WORKSPACE/resultados/$b.txt"
            echo "== $b"; grep -E "browser:|FALHA|Tudo ok|FALHAS|codigo|consola:|Error" "$GITHUB_WORKSPACE/resultados/$b.txt" | head -40
          done
      - name: Gravar os resultados no ramo
        if: always()
        run: |
          git config user.name "combustiveis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A resultados
          git diff --cached --quiet && exit 0
          git commit -m "Resultados do teste da página [skip ci]"
          git push
