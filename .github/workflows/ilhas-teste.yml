name: Teste da página (temporário)
on:
  push:
    branches: [ilhas-teste]
    paths: ["verificacao/**", ".github/workflows/ilhas-teste.yml"]
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright (Chromium, Firefox e WebKit)
        run: |
          set +e
          mkdir -p resultados
          npm init -y >/dev/null
          npm i -s playwright@latest > resultados/instalar.txt 2>&1
          npx playwright --version >> resultados/instalar.txt 2>&1
          npx playwright install --with-deps chromium firefox webkit >> resultados/instalar.txt 2>&1
          echo "codigo de saida $?" >> resultados/instalar.txt
          tail -15 resultados/instalar.txt
      - name: Página publicada, nos três browsers
        if: always()
        run: |
          set +e
          export NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          alvo="$(head -1 verificacao/alvo.txt | tr -d '[:space:]')"
          nome="$(echo "$alvo" | sed -e 's#^https*://##' -e 's#[^A-Za-z0-9.-]#_#g')"
          saida="$GITHUB_WORKSPACE/resultados/pagina/$nome"
          rm -rf "$saida"
          mkdir -p "$saida"
          date -u > "$saida/quando.txt"
          for b in chromium webkit firefox; do
            URL_BASE="$alvo" BROWSER=$b SAIDA="$saida" timeout 540 node verificacao/verificar-pagina.cjs > "$saida/$b.txt" 2>&1
            echo "codigo de saida $?" >> "$saida/$b.txt"
            echo "== $b"
            grep -E "browser:|FALHA|Tudo ok|FALHAS|codigo|consola:|Error" "$saida/$b.txt" | head -40
          done
      - name: Gravar os resultados no ramo
        if: always()
        run: |
          git config user.name "combustiveis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A resultados
          git diff --cached --quiet && exit 0
          git commit -m "Resultados da verificação da página [skip ci]"
          git pull -q --rebase origin ilhas-teste || true
          git push
