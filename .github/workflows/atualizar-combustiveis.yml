# Colocar em .github/workflows/atualizar-combustiveis.yml
name: Atualizar combustíveis

on:
  schedule:
    # De hora a hora entre as 7h e as 21h de Lisboa (6-20 UTC). Assim a página
    # apanha a previsão de sexta-feira ~1h depois de a fonte publicar, em vez
    # de esperar pelo dia seguinte. É barato: só faz commit quando os dados
    # mudam; os runs sem novidade terminam em segundos. Se o GitHub atrasar ou
    # saltar um run (limitação conhecida do cron), o da hora seguinte apanha.
    - cron: '0 6-20 * * *'
  push:
    # Corre logo quando o modelo ou o leitor da DGEG mudam, ou quando uma leitura oficial é registada à mão
    # no override.json, para a página não ficar à espera da hora seguinte.
    paths:
      - 'previsao-propria.mjs'
      - 'dgeg-oficial.mjs'
      - 'override.json'
  workflow_dispatch: # permite correr manualmente no separador Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Ordem: leitura oficial da DGEG -> espelho do setor -> modelo -> placar -> override/ISP -> fiscalidade.
      # Cada passo opcional falha em silêncio (|| true) e deixa os ficheiros como estavam.
      # A leitura oficial de segunda entra sozinha pelo dgeg-oficial.mjs (um pedido à DGEG por semana, à terça).
      # Se falhar, o "Aviso: falta a leitura DGEG" manda email e regista-se à mão em "Registar leitura DGEG".
      - name: Atualizar dados
        run: |
          node dgeg-oficial.mjs || true
          node update-combustiveis.mjs || true
          node previsao-propria.mjs || true
          node placar.mjs || true
          node posprocessar-isp.mjs
          node isp-overlay.mjs || true
          node fiscalidade.mjs || true

      - name: Commit e push (só se houver alterações)
        run: |
          git config user.name "combustiveis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add combustiveis.json
          for f in dgeg-oficial.json previsao-propria.json precisao-log.csv; do [ -f "$f" ] && git add "$f" || true; done
          git diff --cached --quiet || git commit -m "Atualiza dados dos combustiveis [skip ci]"
          git push

      # Item "Combustíveis (semana atual)" do CMS do Webflow: H1, semana, data, frase-resumo,
      # estado e schema da página /precos-combustiveis, calculados a partir do combustiveis.json.
      # Atualiza e publica SÓ esse item (nunca o site: o que estiver por publicar no Designer fica
      # por publicar). Só mexe quando os textos mudam. Precisa do secret WEBFLOW_TOKEN (token do
      # site com CMS: Read and write); sem ele o passo não corre. Se falhar, o run fica com aviso
      # mas os dados já foram guardados acima.
      - name: Atualizar item do CMS no Webflow (só o item, nunca o site)
        if: ${{ secrets.WEBFLOW_TOKEN != '' }}
        continue-on-error: true
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: node webflow-semana.mjs
