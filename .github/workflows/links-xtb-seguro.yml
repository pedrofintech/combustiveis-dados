name: Links para o artigo "XTB é seguro?" (uso único)

# Corre uma vez quando o script é enviado para o repo: põe o link para /artigos/xtb-e-seguro
# em 7 artigos do literaciafinanceira.pt e publica só esses artigos. Depois é apagado.

on:
  push:
    paths:
      - 'links-xtb-seguro.mjs'
      - '.github/workflows/links-xtb-seguro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pôr os links e publicar só esses artigos
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: node links-xtb-seguro.mjs
