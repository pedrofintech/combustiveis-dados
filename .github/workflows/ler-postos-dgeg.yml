name: Ler postos DGEG

# Preços de todos os postos pela API oficial da DGEG (web service do portal Preços dos Combustíveis Online).
# Escreve postos-resumo.json (médias por marca e distrito), postos-top.json (postos mais baratos por distrito e concelhos),
# postos-todos.json (todos os postos com preço recente e coordenadas) e postos-historico.csv (uma fotografia por dia).
# Tudo no dgeg-postos.mjs, que recusa a leitura se os dados não passarem nas verificações descritas lá.
#
# A API só responde em três janelas de uma hora: 03h, 13h e 20h, hora de Lisboa. O cron do GitHub é em UTC, chega horas
# atrasado e salta a maior parte das corridas (neste repositório, o cron de hora a hora do "Atualizar combustíveis" corre
# 2 a 3 vezes por dia). Por isso há uma tentativa de 20 em 20 minutos nas 3 a 4 horas antes de cada janela e durante a
# janela (cobre o inverno e o verão): a corrida que chegar até 3 horas antes de uma janela fica à espera dela e lê assim
# que ela abre; as outras saem em segundos. O grupo de concorrência garante que só uma corrida agendada espera de cada vez
# (as seguintes ficam pendentes e saem logo, porque a leitura já foi feita). O timeout tem de chegar para a espera.
#
# Precisa dos secrets DGEG_USER e DGEG_PASSWORD (Settings > Secrets and variables > Actions). Sem eles avisa e não lê.
#
# Atenção ao cron: o GitHub corre as leituras agendadas em nome de quem fez a última alteração a este ficheiro. Se essa
# pessoa não tiver acesso ao repositório (por exemplo um commit do Claude feito por git), o agendamento fica mudo sem
# avisar. Foi o que aconteceu a 9 nov 2026. Alterações a este ficheiro devem ser feitas pela conta do Pedro (GitHub MCP).
# Se uma leitura falhar e não houver leitura boa há mais de 26 horas, o run falha e o GitHub avisa por email.

on:
  schedule:
    # janela das 3h (Lisboa) -> 23h a 3h UTC; das 13h -> 9h a 13h UTC; das 20h -> 16h a 20h UTC
    - cron: "3,23,43 0,1,2,3,9,10,11,12,13,16,17,18,19,20,23 * * *"
  push:
    branches: [main]
    paths:
      - "dgeg-postos.mjs"
      - ".github/workflows/ler-postos-dgeg.yml"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Ler já, mesmo que já tenha lido nesta janela (fora das janelas a DGEG não responde)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # as corridas agendadas esperam umas pelas outras; um push não fica horas atrás de uma corrida à espera da janela
  group: ler-postos-dgeg-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    outputs:
      mudou: ${{ steps.gravar.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler a API da DGEG (espera pela janela, se estiver perto)
        env:
          DGEG_USER: ${{ secrets.DGEG_USER }}
          DGEG_PASSWORD: ${{ secrets.DGEG_PASSWORD }}
          LF_FORCAR: ${{ inputs.forcar && '1' || '' }}
          LF_ESPERAR: ${{ github.event_name != 'push' && '1' || '' }}
        run: node dgeg-postos.mjs

      - name: Commit e push (só se houver alterações)
        id: gravar
        run: |
          git config user.name "combustiveis-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in postos-resumo.json postos-top.json postos-todos.json postos-historico.csv; do [ -f "$f" ] && git add "$f" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza preços dos postos (DGEG) [skip ci]"
          # Outro workflow pode ter feito push entretanto: junta-se e tenta outra vez. Se outra corrida desta mesma leitura
          # tiver gravado os mesmos ficheiros (aconteceu a 10 nov, dois pushes com 30 s de intervalo), ficam os nossos,
          # que são a leitura mais recente (num rebase, "theirs" é o commit que se está a aplicar, ou seja, o nosso).
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && { echo "mudou=1" >> "$GITHUB_OUTPUT"; exit 0; }
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1

  # A página /combustivel-mais-barato vai buscar estes ficheiros ao jsDelivr quando o raw.githubusercontent.com falha
  # (o GitHub limita os pedidos anónimos por IP). O jsDelivr guarda cada ficheiro do ramo main até 12 horas, por isso
  # manda-se limpar a cópia a seguir a cada leitura. Medido a 13 nov 2026: nos primeiros minutos depois de um push o
  # jsDelivr ainda devolve a versão anterior (e volta a guardá-la), e ao fim de umas 5 limpezas seguidas do mesmo
  # ficheiro recusa mais limpezas durante uma hora. Por isso: esperar 8 minutos, limpar uma vez, confirmar a leitura e,
  # se ainda não for a nova, repetir de 15 em 15 minutos, no máximo 3 vezes. É um job à parte para não contar para o
  # tempo máximo da leitura (que pode esperar horas pela janela da DGEG) e nunca faz falhar o workflow.
  cdn:
    needs: ler
    if: needs.ler.outputs.mudou == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualizar a cópia dos dados no jsDelivr (reserva da página)
        run: |
          novo=$(node -p "require('./postos-resumo.json').lidoEm")
          base="gh/${GITHUB_REPOSITORY}@main"
          sleep 480
          for i in 1 2 3; do
            for f in postos-resumo.json postos-top.json postos-todos.json; do
              curl -sS -m 30 "https://purge.jsdelivr.net/$base/$f" | tr -d '\n ' | cut -c1-300 || true
              echo
            done
            sleep 30
            certos=0
            for f in postos-resumo.json postos-top.json postos-todos.json; do
              tem=$(curl -sS -m 60 "https://cdn.jsdelivr.net/$base/$f" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).lidoEm)}catch(e){console.log('erro')}})" || true)
              [ "$tem" = "$novo" ] && certos=$((certos+1))
            done
            echo "tentativa $i: $certos de 3 ficheiros com a leitura $novo"
            [ "$certos" = "3" ] && exit 0
            [ "$i" = "3" ] || sleep 900
          done
          echo "::warning::O jsDelivr ainda não tem a leitura $novo. A página lê primeiro do raw.githubusercontent.com e mostra sempre a hora da leitura que está a usar."
